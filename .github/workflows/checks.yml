name: Checks
on: [push, pull_request, workflow_dispatch]
jobs:
  foundation:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_PASSWORD: instantflow-local-only
        ports: ["55432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5.0.2"
          elixir-version: "1.19.5"
      - run: mix deps.get --check-locked
      - run: mix precommit
      - run: python3 -m unittest discover -s runner -p 'test_*.py' -v
      - run: python3 -m unittest discover -s deploy -p 'test_*.py' -v
      - run: mix assets.setup && mix assets.build
      - run: mix ecto.create -r Instantflow.OperatorRepo && mix ecto.migrate -r Instantflow.OperatorRepo && mix instantflow.db_roles
      - run: python3 scripts/rehearse_01a.py
      - run: mix run priv/repo/seeds.exs
        env:
          DEMO_PASSWORD: ci-fictional-accounts-only
      - run: mix run --no-start scripts/rehearse_delivery.exs
      - run: mix run --no-start scripts/benchmark.exs
        env:
          BENCHMARK_MIXED: "true"
      - run: mix assets.deploy
        env:
          MIX_ENV: prod

  deploy:
    needs: foundation
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
